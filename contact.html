<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
 <body>
    
     <header>

        <nav class="navbar">

            <div class="logo">

               <img src="images/logo.png" alt="TerangaWear">

            </div>
         
          <ul class="nav-links">

          <li><a href="accueil.html">Accueil</a></li>

          <li><a href="produits.html">Produits</a></li>

          <li><a href="contact.html">Contact</a></li>

          <li><a href="#panier" class="panier">🛒</a></li>

         </ul>

        </nav>

    </header>

    <main>

        <section id="contact">

       <form class="contact-form" action="" method="post">

        <h2>Contactez-nous</h2>

        <div class="form-group">
            <label for="name">Nom:</label>
            <input type="text" id="name" name="name" placeholder="Votre nom">
        </div>

        <div class="form-group">
            <label for="email">e-mail:</label>
            <input type="email" id="email" name="email" placeholder="Votre email">
        </div>

        <div class="form-group">
            <label for="tel">Téléphone:</label>
            <input type="tel" id="tel" name="tel" placeholder="Votre numéro">
        </div>

        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" name="message" placeholder="Écrivez votre message..."></textarea>
        </div>

        <button type="submit">Envoyer</button>

       </form>

      </section>
    
    </main>

 </body>
</html>
